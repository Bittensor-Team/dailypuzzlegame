<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Daily Color Puzzle">
  <title>Daily Color Puzzle</title>
  <!-- Standalone copy of the mark in the page header. The site draws it with
       stylesheet variables and two spin animations; here the colours are
       literal and the rotations are frozen at a flattering angle, because a
       file has to render on its own and a PNG cannot animate. -->
  <style>
    .ticks { fill: none; stroke: #22e0ff; stroke-width: 2.5; stroke-dasharray: 0.8 5; opacity: .85; }
    .sweep { fill: none; stroke: #22e0ff; stroke-width: 2; stroke-linecap: round;
             stroke-dasharray: 30 86; opacity: .9;
             filter: drop-shadow(0 0 4px rgb(34 224 255 / .8)); }
    .hex   { fill: rgb(34 224 255 / .07); stroke: #22e0ff; stroke-width: 1.6; stroke-linejoin: round; }
    .b1 { fill: #31ff5a; filter: drop-shadow(0 0 3px #31ff5a); }
    .b2 { fill: #f2ee4a; filter: drop-shadow(0 0 3px #f2ee4a); }
    .b3 { fill: #ff2be0; filter: drop-shadow(0 0 3px #ff2be0); }
  </style>
  <circle class="ticks" cx="24" cy="24" r="22" transform="rotate(-12 24 24)"/>
  <circle class="sweep" cx="24" cy="24" r="18.5" transform="rotate(250 24 24)"/>
  <path class="hex" d="M24 6.5 39.2 15.25 39.2 32.75 24 41.5 8.8 32.75 8.8 15.25Z"/>
  <rect class="b1" x="16" y="17" width="16" height="3.6" rx="1.8"/>
  <rect class="b2" x="16" y="22.2" width="16" height="3.6" rx="1.8"/>
  <rect class="b3" x="16" y="27.4" width="16" height="3.6" rx="1.8"/>
</svg>
